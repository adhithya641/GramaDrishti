# GramDrishti Phase 7 — Reliability, Confidence & Fallback Configuration
# SIH PS 26074 — Panchayat-Level Weather Downscaling

project: GramDrishti
phase: 7
description: Configuration for Reliability, Confidence & Fallback Layer

reliability:
  levels:
    HIGH:
      description: "Validated and sufficiently reliable for normal display"
    MEDIUM:
      description: "Usable with limitations"
    LOW:
      description: "Prediction shown with strong caution"
    NOT_EVALUABLE:
      description: "Insufficient evidence for reliable prediction"

  # [DESIGN] Engineering starting values for Temperature reliability evaluation
  temperature:
    target_coverage: 0.80
    min_coverage: 0.70  # [DESIGN]
    max_interval_width: 6.0  # [DESIGN] degrees C
    min_valid_value: -10.0
    max_valid_value: 55.0

  # [DESIGN] Engineering starting values for Humidity reliability evaluation
  humidity:
    target_coverage: 0.80
    min_coverage: 0.70  # [DESIGN]
    max_interval_width: 35.0  # [DESIGN] percent
    min_valid_value: 0.0
    max_valid_value: 100.0

  # [DESIGN] Engineering starting values for Rainfall thresholds data sufficiency
  rainfall:
    thresholds:
      "1mm":
        min_training_events: 10  # [DESIGN]
        min_calibration_events: 5  # [DESIGN]
        allow_temporal_shift_downgrade: true
      "10mm":
        min_training_events: 10  # [DESIGN]
        min_calibration_events: 5  # [DESIGN]
        allow_temporal_shift_downgrade: true
      "25mm":
        min_training_events: 10  # [DESIGN]
        min_calibration_events: 5  # [DESIGN]
        allow_temporal_shift_downgrade: true

  # [DESIGN] Panchayat aggregation reliability settings
  panchayat:
    min_grid_cells: 3

  # [DESIGN] Freshness settings (hours)
  freshness:
    fresh_max_hours: 24.0  # [DESIGN]
    aging_max_hours: 48.0  # [DESIGN]

paths:
  reliability_config_yaml: "configs/reliability_config.yaml"
  phase4_validation_json: "data/metadata/validation_phase4_ml.json"
  phase5_validation_json: "data/metadata/validation_phase5_uncertainty.json"
  phase6_validation_json: "data/metadata/validation_phase6_rainfall.json"
  panchayat_reliability_csv: "data/processed/predictions/panchayat_reliability.csv"
  validation_json: "data/metadata/validation_phase7_reliability.json"
