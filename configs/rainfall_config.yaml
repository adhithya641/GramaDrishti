# GramDrishti Phase 6 — Rainfall Probability Configuration
# SIH PS 26074 — Panchayat-Level Weather Downscaling

project: GramDrishti
phase: 6
description: Rainfall probability estimation (1mm, 10mm, 25mm) and Panchayat aggregation

thresholds:
  - 1.0
  - 10.0
  - 25.0

threshold_names:
  1.0: "1mm"
  10.0: "10mm"
  25.0: "25mm"

model_params:
  lgb:
    objective: "binary"
    metric: "binary_logloss"
    learning_rate: 0.05
    n_estimators: 100
    max_depth: 4
    num_leaves: 12
    min_child_samples: 10
    subsample: 0.8
    colsample_bytree: 0.8
    random_state: 42
    n_jobs: -1
    verbose: -1

  logistic:
    penalty: "l2"
    C: 1.0
    solver: "lbfgs"
    max_iter: 1000
    random_state: 42

temporal_split:
  train_start: "2024-01-01"
  train_end: "2024-03-31"
  calibration_start: "2024-04-01"
  calibration_end: "2024-04-30"
  test_start: "2024-05-01"
  test_end: "2024-06-30"

features:
  categorical:
    - "dominant_landcover_class"

  forecast:
    - "forecast_temperature"
    - "forecast_humidity"
    - "forecast_rainfall"
    - "lead_time_hours"

  geospatial:
    - "elevation_mean"
    - "elevation_std"
    - "elevation_range"
    - "slope_mean"
    - "slope_std"
    - "aspect_sin"
    - "aspect_cos"
    - "tri_mean"
    - "tri_std"
    - "landcover_fraction_tree"
    - "landcover_fraction_shrub"
    - "landcover_fraction_grass"
    - "landcover_fraction_cropland"
    - "landcover_fraction_builtup"
    - "landcover_fraction_water"
    - "distance_to_nearest_water"
    - "distance_to_forecast_grid_m"

  temporal:
    - "day_of_year_sin"
    - "day_of_year_cos"
    - "month"

strictly_forbidden_features:
  - "station_id"
  - "station_group"
  - "latitude_obs"
  - "longitude_obs"
  - "observed_temperature"
  - "observed_humidity"
  - "observed_rainfall"
  - "residual_temperature"
  - "residual_humidity"

paths:
  matchups_csv: "data/processed/matchups/weather_matchups.csv"
  geospatial_master_csv: "data/processed/geospatial/geospatial_features_master.csv"
  forecast_grid_mapping_csv: "data/processed/geospatial/forecast_grid_mapping.csv"
  forecasts_processed_csv: "data/processed/forecasts/coimbatore_historical_forecasts_processed.csv"
  models_dir: "models/rainfall/"
  processed_models_dir: "data/processed/models/rainfall/"
  station_predictions_csv: "data/processed/predictions/station_rainfall_predictions.csv"
  panchayat_predictions_csv: "data/processed/predictions/panchayat_rainfall_predictions.csv"
  validation_json: "data/metadata/validation_phase6_rainfall.json"
