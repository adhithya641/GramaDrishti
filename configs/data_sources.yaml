# ============================================================================
# GramDrishti — Data Sources Configuration
# SIH PS 26074: Panchayat-Level Weather Downscaling for Agro-Advisories
# ============================================================================
# This file defines the expected data sources, their formats, required fields,
# and validation rules. No actual data is downloaded by this config — it only
# describes what the system expects to ingest.
#
# IMPORTANT: Do not fabricate source URLs or claim data exists when it does not.
# Use UNKNOWN / UNVERIFIED / UNAVAILABLE where appropriate.
# ============================================================================

project:
  name: "GramDrishti"
  description: "Panchayat-Level Weather Downscaling for Agro-Advisories"
  sih_problem_statement: "PS 26074"
  phase: 1
  phase_name: "Data Acquisition & Data Foundation"

# ---------------------------------------------------------------------------
# Pilot region — SELECTED
# ---------------------------------------------------------------------------
pilot_region:
  status: "SELECTED"
  state: "Tamil Nadu"
  district: "Coimbatore"
  bounding_box:
    min_lat: 10.20
    max_lat: 11.40
    min_lon: 76.60
    max_lon: 77.30
  notes: >
    Pilot region selected: Coimbatore District, Tamil Nadu.
    Chosen for high elevation diversity (Western Ghats slopes to agricultural plains),
    strong station density, and complete multi-layer dataset coverage.

# ---------------------------------------------------------------------------
# Data source definitions
# ---------------------------------------------------------------------------
data_sources:

  boundaries:
    dataset_name: "Panchayat Administrative Boundaries"
    source: "LGD / Open Data India / OSM Admin Boundaries"
    source_url: "https://github.com/datameet/maps"
    local_path: "data/raw/boundaries/"
    format: ["shp", "geojson", "gpkg"]
    variables:
      - "panchayat_name"
      - "panchayat_code"
      - "block_name"
      - "district_name"
      - "state_name"
      - "geometry"
    spatial_resolution: "vector"
    crs: "EPSG:4326"
    temporal_coverage: "static"
    geographic_coverage: "Coimbatore District, Tamil Nadu (10.2°N-11.4°N, 76.6°E-77.3°E)"
    status: "REAL"
    notes: >
      Gram Panchayat administrative boundary polygons for Coimbatore district.

    # Configurable field mapping — maps expected fields to actual column names
    column_mapping:
      panchayat_name: "panchayat_name"
      panchayat_code: "panchayat_code"
      block_name: "block_name"
      district_name: "district_name"
      state_name: "state_name"

    required_fields:
      - "panchayat_name"
      - "district_name"
      - "state_name"
      - "geometry"
    optional_fields:
      - "panchayat_code"
      - "block_name"
      - "block_code"
      - "district_code"
      - "state_code"
      - "area_sq_km"
      - "population"

    raw_dir: "data/raw/boundaries"
    processed_dir: "data/processed/boundaries"

  observations:
    dataset_name: "Weather Station Observations"
    source: "Open-Meteo Weather Station Archives & NOAA GHCN-D / IMD Peelamedu"
    source_url: "https://archive-api.open-meteo.com/v1/archive"
    local_path: "data/raw/observations/"
    format: ["csv"]
    variables:
      - "station_id"
      - "timestamp"
      - "latitude"
      - "longitude"
      - "temperature"
      - "humidity"
      - "rainfall"
    optional_variables:
      - "pressure"
      - "wind_speed"
      - "station_elevation"
    spatial_resolution: "point"
    crs: "EPSG:4326"
    temporal_coverage: "2024-01-01 to 2024-06-30"
    geographic_coverage: "Coimbatore Pilot Box (8 weather stations)"
    status: "REAL"
    notes: >
      Ground weather station observations from 8 stations in Coimbatore pilot region.

    # Configurable column mapping
    column_mapping:
      station_id: "station_id"
      timestamp: "timestamp"
      latitude: "latitude"
      longitude: "longitude"
      temperature: "temperature"
      humidity: "humidity"
      rainfall: "rainfall"
      pressure: "pressure"
      wind_speed: "wind_speed"
      station_elevation: "station_elevation"

    required_fields:
      - "station_id"
      - "timestamp"
      - "latitude"
      - "longitude"
    optional_fields:
      - "temperature"
      - "humidity"
      - "rainfall"
      - "pressure"
      - "wind_speed"
      - "station_elevation"

    raw_dir: "data/raw/observations"
    processed_dir: "data/processed/observations"

  forecasts:
    dataset_name: "Coarse Weather Forecasts"
    source: "Open-Meteo Historical Forecast Archive (ECMWF IFS / GFS Model Runs)"
    source_url: "https://archive-api.open-meteo.com"
    local_path: "data/raw/forecasts/"
    format: ["csv"]
    variables:
      - "forecast_issue_time"
      - "valid_time"
      - "lead_time"
      - "latitude"
      - "longitude"
    optional_variables:
      - "temperature"
      - "humidity"
      - "rainfall"
      - "wind_speed"
      - "pressure"
    spatial_resolution: "0.25 degree"
    crs: "EPSG:4326"
    temporal_coverage: "2024-01-01 to 2024-06-30"
    geographic_coverage: "Coimbatore Pilot Grid (10.2°N-11.4°N, 76.6°E-77.3°E)"
    status: "STAND-IN"
    notes: >
      STAND-IN: This dataset is a forecast stand-in and is not an operational IMD forecast.
      Preserves forecast_issue_time, valid_time, and lead_time.

    # Configurable column mapping
    column_mapping:
      forecast_issue_time: "forecast_issue_time"
      valid_time: "valid_time"
      lead_time: "lead_time"
      latitude: "latitude"
      longitude: "longitude"
      temperature: "temperature"
      humidity: "humidity"
      rainfall: "rainfall"
      wind_speed: "wind_speed"
      pressure: "pressure"

    required_fields:
      - "forecast_issue_time"
      - "valid_time"
      - "lead_time"
      - "latitude"
      - "longitude"
    optional_fields:
      - "temperature"
      - "humidity"
      - "rainfall"
      - "wind_speed"
      - "pressure"

    raw_dir: "data/raw/forecasts"
    processed_dir: "data/processed/forecasts"

  dem:
    dataset_name: "Digital Elevation Model"
    source: "Copernicus DEM 30m / SRTM"
    source_url: "https://copernicus-dem-30m.s3.amazonaws.com"
    local_path: "data/raw/dem/"
    format: ["tif", "tiff"]
    variables:
      - "elevation"
    spatial_resolution: "30m (1 arc-second)"
    crs: "EPSG:4326"
    temporal_coverage: "static"
    geographic_coverage: "Coimbatore Pilot Box (10.2°N-11.4°N, 76.6°E-77.3°E)"
    status: "REAL"
    notes: >
      30m Digital Elevation Model GeoTIFF covering Coimbatore pilot region.
      Do NOT compute slope, aspect, or TRI in Phase 1.

    required_fields:
      - "elevation"
    optional_fields: []

    raw_dir: "data/raw/dem"
    processed_dir: "data/processed/dem"

  landcover:
    dataset_name: "Land Use / Land Cover Classification"
    source: "ESA WorldCover 10m / Copernicus LULC"
    source_url: "https://esa-worldcover.org"
    local_path: "data/raw/landcover/"
    format: ["tif", "tiff", "shp", "geojson"]
    variables:
      - "landcover_class"
    spatial_resolution: "10m"
    crs: "EPSG:4326"
    temporal_coverage: "static"
    geographic_coverage: "Coimbatore Pilot Box (10.2°N-11.4°N, 76.6°E-77.3°E)"
    status: "REAL"
    notes: >
      ESA WorldCover 10m LULC raster covering Coimbatore pilot region.
      Do NOT compute ML features in Phase 1.

    required_fields:
      - "landcover_class"
    optional_fields:
      - "ndvi"
      - "crop_type"

    raw_dir: "data/raw/landcover"
    processed_dir: "data/processed/landcover"

  water:
    dataset_name: "Water Bodies and Coastline"
    source: "Natural Earth / OpenStreetMap Hydrography"
    source_url: "https://www.naturalearthdata.com"
    local_path: "data/raw/water/"
    format: ["shp", "geojson", "gpkg", "tif"]
    variables:
      - "geometry"
    optional_variables:
      - "water_body_name"
      - "water_body_type"
      - "area_sq_km"
      - "is_coastal"
    spatial_resolution: "vector"
    crs: "EPSG:4326"
    temporal_coverage: "static"
    geographic_coverage: "Coimbatore River & Reservoir System (Bhavani, Noyyal, Aliyar, Siruvani)"
    status: "REAL"
    notes: >
      Hydrography vector polygon layer covering rivers and reservoirs in Coimbatore pilot region.

    required_fields:
      - "geometry"
    optional_fields:
      - "water_body_name"
      - "water_body_type"
      - "area_sq_km"
      - "is_coastal"

    raw_dir: "data/raw/water"
    processed_dir: "data/processed/water"

# ---------------------------------------------------------------------------
# Validation rules
# ---------------------------------------------------------------------------
validation:
  coordinate_bounds:
    india_lat_min: 6.0
    india_lat_max: 38.0
    india_lon_min: 68.0
    india_lon_max: 98.0
  max_missing_pct_warn: 10.0
  max_missing_pct_fail: 50.0
  min_records_warn: 10

# ---------------------------------------------------------------------------
# QC classification for observations
# ---------------------------------------------------------------------------
qc_classification:
  VALID: "Value present and passes range/consistency checks"
  MISSING: "Value is null, NaN, or absent"
  SUSPICIOUS: "Value present but outside expected range or flagged by checks"
  INVALID: "Value present but fails type or hard-limit checks"
